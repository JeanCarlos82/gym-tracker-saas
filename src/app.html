<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="theme-color" content="#0d0d0d" />
	<meta name="mobile-web-app-capable" content="yes" />
	<title>GYM Tracker</title>
	<meta name="description" content="Tu tracker de gym gratuito. Registra entrenamientos, sigue tu progreso y mejora cada dia." />
	<meta property="og:type" content="website" />
	<meta property="og:title" content="GYM Tracker — Tu progreso, tu ritmo" />
	<meta property="og:description" content="Registra entrenamientos, sigue tu progreso y mejora cada dia. Gratis, sin anuncios." />
	<meta property="og:image" content="https://frolicking-longma-6bceb5.netlify.app/icon-512.png" />
	<meta property="og:url" content="https://frolicking-longma-6bceb5.netlify.app/" />
	<meta property="og:locale" content="es_ES" />
	<meta name="twitter:card" content="summary" />
	<meta name="twitter:title" content="GYM Tracker" />
	<meta name="twitter:description" content="Tu tracker de gym gratuito. Registra entrenamientos, sigue tu progreso y mejora cada dia." />
	<meta name="twitter:image" content="https://frolicking-longma-6bceb5.netlify.app/icon-512.png" />
	<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
	<link rel="apple-touch-icon" href="/icon-192.png" />
	<link rel="manifest" href="/manifest.json" />
	<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
	%sveltekit.head%
</head>
<body>
	<div id="app-root">%sveltekit.body%</div>
	<noscript>
		<div style="position:fixed;inset:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;color:#f2f2f2;font-family:sans-serif;text-align:center;padding:20px;">
			<div><h1 style="color:#E8FF3A;font-size:48px;margin-bottom:16px;">GYM</h1><p>Necesitas JavaScript activado para usar esta app.</p></div>
		</div>
	</noscript>
	<div id="js-fallback" style="display:none;position:fixed;inset:0;background:#0a0a0a;z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px;text-align:center;">
		<div style="color:#E8FF3A;font-family:sans-serif;font-size:48px;font-weight:bold;letter-spacing:6px;">GYM</div>
		<div style="color:#777;font-family:sans-serif;font-size:13px;">La app tarda en cargar.</div>
		<button onclick="location.reload()" style="background:#E8FF3A;color:#000;border:none;border-radius:10px;padding:14px 28px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:8px;">REINTENTAR</button>
		<div style="color:#555;font-family:sans-serif;font-size:11px;margin-top:12px;">Si el problema persiste, prueba con otro navegador.</div>
	</div>
	<script>
		// Show fallback if app doesn't load in 10s
		var _ft = setTimeout(function() {
			var f = document.getElementById('js-fallback');
			if (f) f.style.display = 'flex';
		}, 10000);
		// Cancel fallback when Svelte mounts
		window.__cancelFallback = function() { clearTimeout(_ft); var f = document.getElementById('js-fallback'); if (f) f.style.display = 'none'; };
		// Clean up old service workers
		try {
			if (navigator.serviceWorker) {
				navigator.serviceWorker.getRegistrations().then(function(r) {
					for (var i = 0; i < r.length; i++) r[i].unregister();
				});
			}
			if (window.caches) {
				caches.keys().then(function(k) {
					for (var i = 0; i < k.length; i++) caches.delete(k[i]);
				});
			}
		} catch(e) {}
	</script>
</body>
</html>
