<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reset GYM Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#f2f2f2;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px}
.card{text-align:center;max-width:320px}
h1{font-size:24px;margin-bottom:12px;color:#E8FF3A}
p{font-size:14px;color:#888;margin-bottom:24px;line-height:1.6}
button{background:#E8FF3A;color:#000;border:none;border-radius:12px;padding:16px 32px;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-bottom:12px}
button:active{transform:scale(0.97)}
.status{font-size:12px;color:#4ade80;margin-top:16px;min-height:20px}
.muted{font-size:11px;color:#555;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h1>Reset App</h1>
<p>Si la app se queda cargando, usa este boton para limpiar el cache y volver a empezar.</p>
<button onclick="doReset()">LIMPIAR Y RECARGAR</button>
<div class="status" id="status"></div>
<div class="muted">Tus datos de entrenamiento no se pierden si tienes cuenta.</div>
</div>
<script>
async function doReset() {
  var s = document.getElementById('status');
  s.textContent = 'Limpiando...';
  try {
    // Unregister all service workers
    if (navigator.serviceWorker) {
      var regs = await navigator.serviceWorker.getRegistrations();
      for (var i = 0; i < regs.length; i++) {
        await regs[i].unregister();
      }
      s.textContent = 'SWs eliminados (' + regs.length + ')... ';
    }
    // Clear all caches
    if (window.caches) {
      var keys = await caches.keys();
      for (var i = 0; i < keys.length; i++) {
        await caches.delete(keys[i]);
      }
      s.textContent += 'Cache limpio... ';
    }
    // Clear localStorage
    localStorage.clear();
    s.textContent += 'OK!';
    // Redirect to app
    setTimeout(function() { location.href = '/'; }, 1000);
  } catch(e) {
    s.textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
